# Checks every push to main and publishes a GitHub release with prebuilt binaries when the
# checks pass, so `mise use github:JacobHayes/gws@latest` installs without compiling.
#
# Releases are calver with a per-day counter: `vYYYY.MM.DD.N` (N starts at 1). Every release
# is a plain, immutable release; a second build on the same day gets the next N rather than
# replacing anything. Nothing needs tagging by hand: the release job creates the tag.
#
# - Every green push to main is released; it is skipped when that commit already has the
#   latest release.
# - `gh workflow run release.yml -R JacobHayes/gws` publishes on demand (`-f force=true` to
#   publish even if main has not moved).
#
# Assets are named `gws-<target>.tar.gz` (plus sha256 sums) so mise autodetects the right one.
# Each target builds natively on a matching runner (the macOS binary links Security.framework,
# so it cannot cross-build from Linux). Linux binaries target musl so they run on any distro.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if this commit already has the latest release
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a running check/build; publishing itself is serialized below.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide the tag first so the builds can bake it into `gws --version` (see build.rs).
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE: ${{ inputs.force || false }}
      SHA: ${{ github.sha }}
    steps:
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          day="$(date -u +%Y.%m.%d)"
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}\\.[0-9]+$")) | [.tag_name, .target_commitish] | @tsv')"
          publish=true
          # Skip when the newest release already points at this commit.
          last="$(printf '%s\n' "$releases" | head -n1 | cut -f2)"
          if [ "$last" = "$SHA" ] && [ "$FORCE" != "true" ]; then
            echo "$SHA already has the latest release; nothing to publish"; publish=false
          fi
          # Next counter for today: one past the highest existing vYYYY.MM.DD.N.
          n="$(printf '%s\n' "$releases" | cut -f1 | { grep -E "^v${day//./\\.}\.[0-9]+$" || true; } | sed 's/.*\.//' | sort -n | tail -n1)"
          tag="v${day}.$(( ${n:-0} + 1 ))"
          echo "tag=$tag publish=$publish sha=$SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: mise run check

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      # Unset (a `-dev` version) when this run will not publish.
      GWS_VERSION: ${{ needs.plan.outputs.publish == 'true' && needs.plan.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release --locked --package google-workspace-cli --target "$TARGET"
          staging="$(mktemp -d)/gws-$TARGET"
          mkdir -p "$staging" dist
          cp "target/$TARGET/release/gws" README.md LICENSE "$staging/"
          tar -C "$(dirname "$staging")" -czf "dist/gws-$TARGET.tar.gz" "gws-$TARGET"
          (cd dist && shasum -a 256 "gws-$TARGET.tar.gz" > "gws-$TARGET.tar.gz.sha256")
          # Every binary runs on its own runner: smoke-test it and show the baked-in version.
          "$staging/gws" --version
      - uses: actions/upload-artifact@v7
        with:
          name: gws-${{ matrix.target }}
          path: dist/*

  release:
    needs: [plan, check, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; releases are immutable, re-run to get the next counter" >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "gws $TAG" --notes "Build of main at $SHA." dist/*
          echo "published $TAG"
