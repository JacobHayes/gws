[settings]
# mise.lock pins what "latest" resolved to, so CI and every checkout install the same
# versions; bump with `mise upgrade`.
lockfile = true

[tools]
# `mise install` sets up everything the release build needs, locally and in CI: toolchain,
# clippy/rustfmt, and the release targets (each built natively on a matching runner).
rust = { version = "latest", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"] }

[tasks.check]
description = "verify the workspace: format, clippy, tests"
run = """
set -eu
cargo fmt --all -- --check
cargo clippy --workspace --locked -- -D warnings
cargo test --workspace --locked
"""
